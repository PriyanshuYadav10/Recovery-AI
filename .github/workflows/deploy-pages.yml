name: Deploy console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - working-directory: frontend
        run: flutter pub get

      # Points the deployed console at the Render-hosted backend. Update this
      # if recovery-ai-brain ends up at a different onrender.com URL.
      - working-directory: frontend
        run: |
          flutter build web --release \
            --base-href /Recovery-AI/ \
            --dart-define=API_BASE_URL=https://recovery-ai-brain.onrender.com

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
