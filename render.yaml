# Render Blueprint for Recovery AI.
# Deploy: push this repo to GitHub, then in Render -> New -> Blueprint,
# point it at the repo. Render reads this file and creates all three
# services below. Fill in the secrets it prompts for (marked sync: false).
#
# Service URLs are wired together assuming the `name:` fields below stay
# unique on onrender.com (Render's default is https://<name>.onrender.com).
# If Render had to rename any of them because the name was taken, update the
# corresponding *_URL env vars in the dashboard to match.

services:
  # FastAPI "brain": conversation engine, lead scoring, compliance ledger.
  # Free plan: no persistent disk, so the SQLite ledger and call recordings
  # under /app/data reset on every deploy and whenever the instance spins
  # down from idle (Render free web services sleep after ~15min of no
  # traffic and start fresh on the next request). Fine for a demo; if the
  # ledger needs to survive restarts, move it to a free external Postgres
  # (e.g. Neon/Supabase) instead, or upgrade this service to a paid plan
  # and re-add a `disk:` block mounted at /app/data.
  - type: web
    name: recovery-ai-brain
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: BRIDGE_BASE_URL
        value: https://recovery-ai-bridge.onrender.com
      - key: HUMAN_QUEUE_NUMBER
        sync: false

  # Node/Twilio telephony bridge. Only needed for real phone calls; leave its
  # Twilio env vars blank to run without a live phone number.
  - type: web
    name: recovery-ai-bridge
    runtime: docker
    plan: free
    dockerfilePath: telephony/bridge/Dockerfile
    dockerContext: telephony/bridge
    envVars:
      - key: RECOVERY_API_URL
        value: https://recovery-ai-brain.onrender.com
      - key: VOICE_PIPELINE
        value: gather
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: HUMAN_QUEUE_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # Flutter web console, built and served via nginx. API_BASE_URL is baked
  # into the compiled JS at build time (Render turns Docker service env vars
  # into build args automatically), so it must match recovery-ai-brain's URL.
  - type: web
    name: recovery-ai-console
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: API_BASE_URL
        value: https://recovery-ai-brain.onrender.com
